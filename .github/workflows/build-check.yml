name: build-check

# Belt-and-suspenders with the schema gate: make sure the site actually builds
# before a PR can merge, so a broken template or bad data can't slip through.
on:
  pull_request:
    paths:
      - "src/**"
      - "data/**"
      - "public/**"
      - "astro.config.mjs"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
